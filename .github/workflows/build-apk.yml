name: Build Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create dummy notification sound file
        run: |
          # The app.json configures expo-notifications with custom sound named "default".
          # expo-notifications plugin expects to find a file named "default" in the project root
          # to copy into android/app/src/main/res/raw/default.
          # We create a dummy file on the fly here to prevent prebuild failure.
          touch default

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
